<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Request Early Access</title>
<style>
  :root{
    --cream:#f6e79f;
    --red:#ef3e36;
    --ink:#141414;
    --ring:rgba(20,20,20,.55);
    /* the single visible "middle circle" everything must live inside —
       tied to vmin so it always fits both the width AND height of the
       phone screen, whatever the aspect ratio */
    --circle: min(86vmin, 440px);
    /* shared CTA pill height, referenced by both the box and its handle so
       the handle is always sized correctly relative to the box */
    --cta-h: clamp(46px, 12vmin, 58px);
    /* logo/leaf box size — the DNA it cross-fades into is scaled off this
       same value (see #dnaOrbit) so it always matches the leaf's footprint */
    --logo-size: clamp(52px, 14vmin, 80px);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{
    height:100%;
    height:100dvh;
    overflow:hidden;
    overscroll-behavior:none;
  }
  body{
    background:var(--cream);
    overflow:hidden;
    position:fixed;
    top:0;right:0;bottom:0;left:0;
    width:100%;
    font-family:-apple-system,'Helvetica Neue',Arial,sans-serif;
    touch-action:none;
    -webkit-user-select:none;
    user-select:none;
  }

  /* futuristic dot-grid backdrop */
  canvas#dots{
    position:fixed;top:0;right:0;bottom:0;left:0;width:100%;height:100%;display:block;
  }

  .scene{
    position:fixed;top:0;right:0;bottom:0;left:0;
    display:flex;align-items:center;justify-content:center;
    perspective:1800px;
  }

  .rings{
    position:absolute;top:0;right:0;bottom:0;left:0;
    animation: sceneIn 1.5s cubic-bezier(.16,1,.3,1) both;
    transform-style:preserve-3d;
  }
  .ring{
    position:absolute;
    top:50%;left:50%;
    border:1px solid var(--ring);
    border-radius:50%;
    transform:translate(-50%,-50%);
    transform-style:preserve-3d;
    will-change:transform;
    transition:border-color .9s ease, box-shadow .9s ease;
  }
  /* two big background rings, offset from center like the desktop version
     (rather than dead-centered), so the middle circle reads as sitting
     inside a cluster of surrounding orbits rather than alone. Sized in
     vmin — not vmax — and kept just big enough relative to --circle that
     the middle circle always ends up fully nested inside both of them
     (checked against several phone aspect ratios), so their outlines
     never cross through it */
  .ring-a{ width:195vmin; height:195vmin; top:36%; left:62%; animation:spin 100s linear infinite; }
  .ring-b{ width:150vmin; height:150vmin; top:56%; left:42%; animation:spin 65s linear infinite reverse; }
  /* this is the one visible "middle circle" — sized to --circle so
     literally everything (logo, tagline, CTA, gesture link) sits inside it */
  .ring-c{ width:var(--circle); height:var(--circle); top:50%; left:50%; animation:spin 40s linear infinite; opacity:.85; }

  /* rings glow red once "Start with you" is clicked */
  .rings.glow .ring{
    border-color:#ff1f3d;
    box-shadow:0 0 16px 1px rgba(255,31,61,.55), 0 0 34px 3px rgba(255,31,61,.3);
  }

  /* on click, the outlines tilt into 3D and tumble around their own vertical
     axis (instead of the flat, in-plane spin) — same crossing-arc look, but
     with real depth as they turn */
  @keyframes spin3d{
    from{ transform:translate(-50%,-50%) rotateX(58deg) rotateY(0deg); }
    to{   transform:translate(-50%,-50%) rotateX(58deg) rotateY(360deg); }
  }
  @keyframes spin3dRev{
    from{ transform:translate(-50%,-50%) rotateX(58deg) rotateY(360deg); }
    to{   transform:translate(-50%,-50%) rotateX(58deg) rotateY(0deg); }
  }
  .rings.fast .ring-a{ animation:spin3d 22s linear infinite; }
  .rings.fast .ring-b{ animation:spin3dRev 15s linear infinite; }
  .rings.fast .ring-c{ animation:spin3d 9s linear infinite; }

  .orbit-dot{
    position:absolute;
    width:13px;height:13px;margin:-6.5px;
    border-radius:50%;
    background:var(--red);
    box-shadow:0 0 14px rgba(239,62,54,.55);
  }
  .orbit-dot.sm{ width:9px;height:9px;margin:-4.5px; box-shadow:0 0 9px rgba(239,62,54,.5);}

  @keyframes spin{ to{ transform:translate(-50%,-50%) rotate(360deg);} }
  @keyframes sceneIn{
    from{ opacity:0; transform:scale(.78);}
    to{ opacity:1; transform:scale(1);}
  }

  .hero{
    position:relative; z-index:5;
    display:flex;flex-direction:column;align-items:center;
    gap:clamp(16px,4.2vmin,32px);
    /* everything in here is capped to a chord of the middle circle, well
       short of its full diameter, so it never pokes out of the ring */
    width:calc(var(--circle) * .7);
    animation: heroIn 1.2s cubic-bezier(.16,1,.3,1) both;
    animation-delay:.2s;
  }
  @keyframes heroIn{
    from{opacity:0; transform:translateY(22px) scale(.9);}
    to{opacity:1; transform:translateY(0) scale(1);}
  }

  .logo{
    width:100%;height:100%;
    filter:drop-shadow(0 14px 26px rgba(239,62,54,.35));
    animation: breathe 4.2s ease-in-out infinite;
  }
  @keyframes breathe{
    0%,100%{transform:scale(1);}
    50%{transform:scale(1.07);}
  }

  .brand-stack{
    display:flex;flex-direction:column;align-items:center;gap:22px;
  }

  @keyframes lineIn{
    from{ opacity:0; transform:translateY(10px); }
    to{ opacity:1; transform:translateY(0); }
  }

  /* tagline sits above the box, in normal document flow */
  .tagline{
    font-size:clamp(13px,3.6vmin,17px);font-weight:600;line-height:1.4;
    color:var(--ink);
    text-align:center;
    width:100%;
    opacity:0;
    animation: lineIn .9s cubic-bezier(.16,1,.3,1) both;
    animation-delay:.4s;
  }

  /* the CTA box sits still — it never moves. Only the little arrow handle
     inside it drags, left to right. */
  .cta-row{
    display:flex;align-items:center;justify-content:center;
    width:100%;
    opacity:0;
    animation: lineIn .9s cubic-bezier(.16,1,.3,1) both;
    animation-delay:.6s;
  }

  /* one single pill — the box itself IS the track. It never moves; only
     the light circular handle drags across it, left to right. */
  .cta-box{
    position:relative;
    display:flex;align-items:center;justify-content:center;
    background:var(--ink);color:#fff;
    width:100%;
    height:var(--cta-h);
    border-radius:999px;
    border:1.5px solid rgba(255,255,255,.35);
    box-shadow:0 14px 30px rgba(20,20,20,.25);
    transition:box-shadow .25s ease, background .25s ease, opacity .6s ease;
  }
  .cta-box.dragging{
    background:var(--red);
    box-shadow:0 16px 34px rgba(239,62,54,.35);
  }
  /* once triggered, the whole CTA fades away — reappears when the panel is dismissed */
  .cta-box.sent{
    opacity:0;
    pointer-events:none;
  }

  .cta-label{
    font-size:clamp(12.5px,3.3vmin,16px);font-weight:600;font-family:inherit;
    white-space:nowrap;
    transition:opacity .25s ease;
  }

  .cta-handle{
    position:absolute;top:4px;left:4px;
    width:calc(var(--cta-h) - 8px);height:calc(var(--cta-h) - 8px);border-radius:50%;
    background:linear-gradient(160deg,#ffffff,#d9d9d9);
    display:flex;align-items:center;justify-content:center;
    cursor:grab;
    touch-action:none;
    box-shadow:0 4px 10px rgba(0,0,0,.3);
  }
  .cta-handle.grabbing{ cursor:grabbing; }
  .cta-handle .arrow{
    width:20px;height:20px;color:var(--ink);flex-shrink:0;
  }
  .cta-box::after{
    content:"";position:absolute;top:-6px;right:-6px;bottom:-6px;left:-6px;border-radius:999px;
    border:2px solid var(--red);opacity:0;pointer-events:none;
  }
  .cta-box.ripple::after{ animation: ctaRipple .7s ease-out; }
  @keyframes ctaRipple{
    from{ opacity:.9; transform:scale(1); }
    to{ opacity:0; transform:scale(1.55); }
  }

  /* pinch-and-slide hand gesture — a quiet text caption under the CTA.
     Positioned absolutely (anchored to .hero, which is already
     position:relative) rather than as a flex child, so it sits below the
     CTA purely visually without adding to the hero's own height — the
     hero (and the DNA/logo inside it) stays centered exactly where it was
     before this caption existed. The camera feed itself is never shown on
     screen — it's only read in memory to track the pinch, so
     .gesture-preview stays visually hidden at all times. */
  /* a dedicated keyframe (rather than the shared lineIn) so the entrance
     slide's translateY doesn't clobber the translateX(-50%) centering —
     animating `transform` replaces the whole value, it doesn't compose
     with a separately-declared transform */
  @keyframes gestureLineIn{
    from{ opacity:0; transform:translateX(-50%) translateY(10px); }
    to{ opacity:1; transform:translateX(-50%) translateY(0); }
  }
  .gesture-row{
    position:absolute;
    left:50%;top:100%;
    transform:translateX(-50%);
    margin-top:clamp(10px,2.6vmin,18px);
    width:100%;
    text-align:center;
    opacity:0;
    animation: gestureLineIn .9s cubic-bezier(.16,1,.3,1) both;
    animation-delay:.8s;
    transition:opacity .6s ease;
  }
  /* fades away as the translucent waitlist panel comes up, same beat as the
     CTA itself — reappears once the panel is dismissed. animation:none is
     required here to release the entrance animation's fill-mode, which
     would otherwise keep holding opacity:1 and block this from taking effect */
  .gesture-row.sent{
    animation:none;
    opacity:0;
    pointer-events:none;
  }
  .gesture-link{
    font-family:inherit;font-size:clamp(10.5px,2.8vmin,12.5px);font-weight:600;
    color:rgba(20,20,20,.42);
    background:none;border:none;padding:4px;cursor:pointer;
    white-space:normal;
    transition:color .2s ease;
  }
  .gesture-link:hover{ color:rgba(20,20,20,.7); }
  .gesture-link:disabled{ cursor:default; }
  .gesture-link.active{ color:var(--red); }
  .gesture-link.loading{ animation:gesturePulse 1s ease-in-out infinite; }
  @keyframes gesturePulse{ 0%,100%{ opacity:.4; } 50%{ opacity:1; } }
  .gesture-link.shake{ animation:gestureShake .45s ease; }
  @keyframes gestureShake{
    0%,100%{ transform:translateX(0); }
    25%{ transform:translateX(-4px); }
    75%{ transform:translateX(4px); }
  }

  /* camera feed used only for hand tracking — never rendered on screen */
  .gesture-preview{
    position:fixed;top:0;left:0;
    width:1px;height:1px;
    overflow:hidden;
    opacity:0;
    pointer-events:none;
  }

  /* info panel — a translucent glass card that fades in, well after the
     DNA/ring effect. Leaf mark up top, the tagline again as the headline,
     then a translucent email field to actually join the waitlist. */
  .info-modal{
    position:fixed;top:0;right:0;bottom:0;left:0;z-index:50;
    display:flex;align-items:center;justify-content:center;
    background:rgba(20,20,20,0);pointer-events:none;
    transition:background 1.1s ease;
  }
  .info-modal.open{ background:rgba(20,20,20,.55);pointer-events:auto; }
  .info-panel{
    width:min(400px,88vw);
    background:rgba(255,255,255,.08);
    -webkit-backdrop-filter:blur(26px);
    backdrop-filter:blur(26px);
    border:1px solid rgba(255,255,255,.22);
    border-radius:28px;
    padding:34px 26px 28px;
    box-shadow:0 40px 90px rgba(20,20,20,.35);
    position:relative;
    display:flex;flex-direction:column;align-items:center;gap:22px;
    text-align:center;
    transform:translateY(24px) scale(.94);opacity:0;
    transition:transform 1s cubic-bezier(.16,1,.3,1), opacity 1.15s ease;
  }
  .info-modal.open .info-panel{ transform:translateY(0) scale(1);opacity:1; }
  .info-close{
    position:absolute;top:18px;right:18px;width:32px;height:32px;
    border-radius:50%;border:none;background:rgba(255,255,255,.12);
    color:#fff;font-size:18px;line-height:1;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:background .2s ease;
  }
  .info-close:hover{ background:rgba(255,255,255,.22); }
  /* the same rotating DNA helix as the hero, shrunk down and always spinning
     here — no leaf, no cross-fade, just the strand turning in place */
  .info-dna-slot{
    position:relative;
    width:64px;height:64px;
    filter:drop-shadow(0 10px 20px rgba(239,62,54,.35));
  }
  .info-dna-slot .dna-orbit{ transform:scale(.62); }
  .info-title{
    /* scales down a touch on narrow phones so the manual line break above
       reliably lands as exactly two lines instead of wrapping a third */
    font-size:clamp(15px,4.4vw,18px);font-weight:800;letter-spacing:-.01em;line-height:1.4;
    color:#fff;margin:0;
  }

  /* translucent email row — input + submit, sunk into the glass */
  .info-email-row{ position:relative;width:100%; }
  .info-email-input{
    width:100%;height:52px;
    padding:0 58px 0 20px;
    border-radius:999px;
    background:rgba(255,255,255,.1);
    border:1px solid rgba(255,255,255,.28);
    color:#fff;
    /* 16px keeps iOS Safari from auto-zooming (and shifting the whole
       page) when this field gets focus */
    font-size:16px;font-family:inherit;
    -webkit-user-select:text;user-select:text;
    transition:background .2s ease, border-color .2s ease;
  }
  .info-email-input::placeholder{ color:rgba(255,255,255,.55); }
  .info-email-input:focus{
    outline:none;
    background:rgba(255,255,255,.16);
    border-color:rgba(255,255,255,.5);
  }
  .info-email-submit{
    position:absolute;top:4px;right:4px;
    width:44px;height:44px;border-radius:50%;
    background:var(--red);border:none;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 6px 16px rgba(239,62,54,.45);
    transition:background .2s ease;
  }
  .info-email-submit:hover{ background:#ff1f3d; }
  .info-email-submit svg{ width:17px;height:17px;color:#fff; }
  /* the post-submit success view — tier badge, a big queue number, a
     playful nudge to share, and a share button. Swaps in for the form. */
  .info-success{
    display:none;
    width:100%;
    flex-direction:column;
    align-items:center;
    gap:20px;
  }
  .info-panel.submitted .info-email-row{ display:none; }
  .info-panel.submitted .info-success{ display:flex; }

  .queue-big{
    font-size:56px;font-weight:200;line-height:1;
    color:#fff;letter-spacing:-.02em;
  }
  .queue-sub{
    margin-top:-10px;
    font-size:14px;color:rgba(255,255,255,.6);
  }
  .share-nudge{
    width:100%;box-sizing:border-box;
    background:rgba(0,0,0,.22);
    border:1px solid rgba(255,255,255,.14);
    border-radius:18px;
    padding:16px 18px;
    text-align:left;
  }
  .share-nudge .share-line{ font-size:14px;font-weight:700;color:#fff;margin:0 0 4px; }
  .share-nudge .share-note{ font-size:12.5px;color:rgba(255,255,255,.55); }
  .share-btn{
    width:100%;height:52px;
    border-radius:999px;
    background:#fff;color:var(--ink);
    border:none;cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:8px;
    font-size:15px;font-weight:700;font-family:inherit;
    transition:background .2s ease;
  }
  .share-btn:hover{ background:#f1f1f1; }
  .share-btn svg{ width:18px;height:18px;flex-shrink:0; }

  /* on mobile the loose scattered dots read as clutter outside the one
     visible circle, so they're hidden here — the circle's own orbit dots
     are enough */
  .stray-dot{ display:none; }
  @keyframes float{
    0%,100%{ transform:translateY(0);}
    50%{ transform:translateY(-12px);}
  }

  /* ===== 3D DNA effect: the leaf cross-fades into a DNA helix in its own
     exact spot (same size, same angle, no travelling), which then just
     keeps turning in place on its vertical axis forever — front, side,
     back, side — like a turntable. ===== */
  .logo-slot{
    position:relative;
    width:var(--logo-size);height:var(--logo-size);
  }
  .logo{
    position:absolute;top:0;right:0;bottom:0;left:0;width:100%;height:100%;
    transition:opacity .9s ease;
  }
  .logo.leaf-fade{ opacity:0; }

  .dna-orbit{
    position:absolute;top:0;right:0;bottom:0;left:0;
    display:flex;align-items:center;justify-content:center;
    perspective:420px;
    pointer-events:none;
  }
  /* the hero's own DNA (not the small copy in the info panel below) is
     scaled by the same ratio the logo box itself has shrunk by, so it
     always reads as the same size as the leaf it fades into, instead of
     the fixed desktop-sized 36x100px strand looming over a smaller mobile
     logo */
  #dnaOrbit{ transform: scale(calc(var(--logo-size) / 104px)); }
  /* sized to match the leaf's own 104x104 footprint, tilted 45deg to sit on
     the same diagonal axis as the leaf mark (its points run top-right to
     bottom-left) */
  .dna-helix{
    position:relative;
    width:36px;height:100px;
    transform:rotate(45deg);
    transform-style:preserve-3d;
    opacity:0;
    transition:opacity .9s ease;
  }
  .dna-orbit.active .dna-helix{ opacity:1; }

  /* the only motion: a constant, unhurried spin around the vertical axis,
     so every side of the strand is visible in turn without it ever moving
     from its spot */
  .dna-twist{
    position:absolute;top:0;right:0;bottom:0;left:0;
    transform-style:preserve-3d;
    animation:selfSpin 4.6s linear infinite;
  }
  @keyframes selfSpin{ to{ transform:rotateY(360deg); } }

  .rung{
    position:absolute;left:0;width:100%;height:0;
    transform-style:preserve-3d;
  }
  /* half red, half black — no glow */
  .rung .bp{
    position:absolute;top:0;left:0;width:100%;height:2px;
    background:linear-gradient(90deg, var(--red), var(--ink));
    border-radius:2px;
  }
  .rung .nt{
    position:absolute;top:-3.5px;width:8px;height:8px;border-radius:50%;
  }
  .rung .nt.a{ left:-4px;background:var(--red); }
  .rung .nt.b{ left:auto;right:-4px;background:var(--ink); }
</style>
</head>
<body>

<canvas id="dots"></canvas>

<div class="scene" id="scene">
  <div class="rings">
    <div class="ring ring-a">
      <span class="orbit-dot" style="left:74%; top:8.4%;"></span>
      <span class="orbit-dot sm" style="left:91.6%; top:74%;"></span>
      <span class="orbit-dot" style="left:26%; top:91.6%;"></span>
      <span class="orbit-dot sm" style="left:8.4%; top:26%;"></span>
    </div>
    <div class="ring ring-b">
      <span class="orbit-dot" style="left:50%; top:2%;"></span>
      <span class="orbit-dot sm" style="left:98%; top:50%;"></span>
      <span class="orbit-dot" style="left:50%; top:98%;"></span>
      <span class="orbit-dot sm" style="left:2%; top:50%;"></span>
    </div>
    <div class="ring ring-c">
      <span class="orbit-dot sm" style="left:91.6%; top:26%;"></span>
      <span class="orbit-dot sm" style="left:8.4%; top:74%;"></span>
    </div>
  </div>

  <div class="hero">
    <div class="brand-stack">
      <div class="logo-slot">
        <svg class="logo" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
          <path d="M100,0 C100,55.23 55.23,100 0,100 C0,44.77 44.77,0 100,0 Z" fill="#ef3e36"/>
        </svg>

        <!-- DNA that the leaf cross-fades into, right in the same spot -->
        <div class="dna-orbit" id="dnaOrbit" aria-hidden="true">
          <div class="dna-helix" id="dnaHelix">
            <div class="dna-twist" id="dnaTwist"><!-- rungs injected by JS --></div>
          </div>
        </div>
      </div>
    </div>

    <!-- tagline, in plain document flow above the box -->
    <p class="tagline">The world's first OS that turns your health data into food.</p>

    <!-- the CTA box — fixed in place. Only the arrow handle inside drags. -->
    <div class="cta-row">
      <div class="cta-box" id="ctaBox" role="button" tabindex="0">
        <span class="cta-label" id="ctaLabel">Join the waitlist</span>
        <div class="cta-handle" id="ctaHandle">
          <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </div>
      </div>
    </div>

    <!-- small caption under the CTA: pinch thumb + index together in the
         air, then slide right, to join the same way as dragging the handle -->
    <div class="gesture-row">
      <button type="button" class="gesture-link" id="gestureToggle">Or <u>enable</u> gesture control to join</button>
    </div>
  </div>
</div>

<!-- info panel, opened by the CTA -->
<div class="info-modal" id="infoModal">
  <div class="info-panel" id="infoPanel">
    <button class="info-close" id="infoClose" aria-label="Close">&times;</button>
    <div class="info-dna-slot">
      <div class="dna-orbit active" aria-hidden="true">
        <div class="dna-helix">
          <div class="dna-twist" id="infoDnaTwist"><!-- rungs injected by JS --></div>
        </div>
      </div>
    </div>
    <h3 class="info-title">The world's first OS that turns<br>your health data into food.</h3>
    <form class="info-email-row" id="waitlistForm">
      <input type="email" class="info-email-input" id="waitlistEmail" placeholder="Enter your email" required>
      <button type="submit" class="info-email-submit" aria-label="Join the waitlist">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
    </form>
    <div class="info-success" id="infoSuccess">
      <div class="queue-big"><span id="queueNumber">1237</span></div>
      <p class="queue-sub">on the waitlist</p>
      <div class="share-nudge">
        <p class="share-line">Share the news to get early access.</p>
        <span class="share-note">Early access gets you a free month of premium, on the house.</span>
      </div>
      <button type="button" class="share-btn" id="shareBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 8l5-5 5 5M5 21h14"/></svg>
        <span id="shareLabel">Share the news</span>
      </button>
    </div>
  </div>
</div>

<span class="stray-dot" style="width:8px;height:8px; left:2%; top:9%; animation-delay:.2s;"></span>
<span class="stray-dot" style="width:7px;height:7px; left:14%; top:58%; animation-delay:1.1s;"></span>
<span class="stray-dot" style="width:6px;height:6px; left:4%; top:88%; animation-delay:2s;"></span>
<span class="stray-dot" style="width:8px;height:8px; left:97%; top:6%; animation-delay:.7s;"></span>
<span class="stray-dot" style="width:6px;height:6px; left:98%; top:80%; animation-delay:1.6s;"></span>
<span class="stray-dot" style="width:9px;height:9px; left:64%; top:90%; animation-delay:2.4s;"></span>

<!-- camera feed for the pinch-and-slide gesture — started by the small
     "enable hand gesture" text under the CTA; kept off-screen at all times,
     it's only read in memory to track the pinch, never shown to the visitor -->
<div class="gesture-preview" id="gesturePreview">
  <video id="gestureVideo" autoplay playsinline muted></video>
  <canvas id="gestureCanvas"></canvas>
</div>

<script>
  // Gemini-style reactive dot grid background
  const canvas = document.getElementById('dots');
  const ctx = canvas.getContext('2d');
  let w, h, dpr, points = [];
  const SPACING = 36;
  const mouse = { x: -9999, y: -9999 };

  function resize(){
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = window.innerWidth; h = window.innerHeight;
    canvas.width = w * dpr; canvas.height = h * dpr;
    canvas.style.width = w + 'px'; canvas.style.height = h + 'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
    buildGrid();
  }

  function buildGrid(){
    points = [];
    const cols = Math.ceil(w / SPACING) + 1;
    const rows = Math.ceil(h / SPACING) + 1;
    for(let i=0;i<cols;i++){
      for(let j=0;j<rows;j++){
        points.push({
          x: i * SPACING,
          y: j * SPACING,
          phase: Math.random() * Math.PI * 2
        });
      }
    }
  }

  function draw(t){
    ctx.clearRect(0,0,w,h);
    for(const p of points){
      const wave = Math.sin(t*0.0006 + p.phase) * 0.5 + 0.5; // 0..1
      let alpha = 0.05 + wave * 0.09;
      let radius = 1.1;

      const dx = mouse.x - p.x, dy = mouse.y - p.y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      const influence = Math.max(0, 1 - dist / 160);
      if(influence > 0){
        alpha += influence * 0.35;
        radius += influence * 1.8;
      }

      ctx.beginPath();
      ctx.arc(p.x, p.y, radius, 0, Math.PI*2);
      ctx.fillStyle = `rgba(20,20,20,${alpha.toFixed(3)})`;
      ctx.fill();
    }
    requestAnimationFrame(draw);
  }

  window.addEventListener('resize', resize);
  window.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
  window.addEventListener('mouseleave', () => { mouse.x = -9999; mouse.y = -9999; });

  resize();
  requestAnimationFrame(draw);

  // subtle parallax "zoom" toward cursor on the whole scene — cursor-only,
  // skipped on touch screens so a tap never nudges the layout
  const scene = document.getElementById('scene');
  const hasFinePointer = window.matchMedia('(pointer: fine)').matches;
  if (hasFinePointer) {
    window.addEventListener('mousemove', e => {
      const nx = (e.clientX / window.innerWidth - 0.5) * 2;
      const ny = (e.clientY / window.innerHeight - 0.5) * 2;
      scene.style.transform = `scale(1.02) translate(${nx * -8}px, ${ny * -8}px)`;
    });
  }

  // CTA — opens the placeholder panel once the DNA effect finishes
  const ctaBox = document.getElementById('ctaBox');
  const modal = document.getElementById('infoModal');
  const closeBtn = document.getElementById('infoClose');
  const gestureRow = document.querySelector('.gesture-row');

  function retrigger(el, cls){
    el.classList.remove(cls);
    void el.offsetWidth; // restart animation
    el.classList.add(cls);
  }

  // ----- build the double-helix rungs — once for the hero strand, and
  // once more for the small always-spinning copy inside the info panel -----
  const RUNG_COUNT = 14;
  const HELIX_H = 100; // px, matches .dna-helix height
  const TWIST_DEG = 26; // rotation added per rung, builds the helical turn

  function buildHelixRungs(twistEl){
    for (let i = 0; i < RUNG_COUNT; i++) {
      const top = (i / (RUNG_COUNT - 1)) * HELIX_H;
      const angle = i * TWIST_DEG;
      const rung = document.createElement('div');
      rung.className = 'rung';
      rung.style.top = top + 'px';
      rung.style.transform = `rotateY(${angle}deg)`;
      rung.innerHTML = '<span class="bp"></span><span class="nt a"></span><span class="nt b"></span>';
      twistEl.appendChild(rung);
    }
  }

  const dnaTwist = document.getElementById('dnaTwist');
  const infoDnaTwist = document.getElementById('infoDnaTwist');
  buildHelixRungs(dnaTwist);
  buildHelixRungs(infoDnaTwist);

  // ----- leaf → DNA cross-fade, in place, same angle -----
  const dnaOrbit = document.getElementById('dnaOrbit');
  const logo = document.querySelector('.logo');
  const ringsWrap = document.querySelector('.rings');
  const PLACEHOLDER_DELAY_MS = 1800; // let the DNA + glowing rings play out longer before the panel appears

  function resetDnaEffect(){
    dnaOrbit.classList.remove('active');
    logo.classList.remove('leaf-fade');
    ringsWrap.classList.remove('glow', 'fast');
    ctaBox.classList.remove('dragging'); // back to black once the panel is dismissed
    ctaBox.classList.remove('sent'); // and fades back in, ready to use again
    gestureRow.classList.remove('sent'); // the gesture caption reappears too
  }

  function playDnaEffect(){
    resetDnaEffect();
    void dnaOrbit.offsetWidth; // restart cleanly
    // leaf and DNA fade at the same time, in the same spot, same angle —
    // the DNA then just keeps turning in place (see .dna-twist) forever —
    // the ring outlines glow red, and every ring (all the small circles
    // riding on them) speeds up together
    dnaOrbit.classList.add('active');
    logo.classList.add('leaf-fade');
    ringsWrap.classList.add('glow', 'fast');
  }

  function activateStart(){
    retrigger(ctaBox, 'ripple');
    playDnaEffect(); // this calls resetDnaEffect() internally, which clears 'dragging'/'sent' — so add them after
    ctaBox.classList.add('dragging'); // stays red once triggered, whether by drag or tap
    setTimeout(() => {
      ctaBox.classList.add('sent'); // the whole CTA fades away, after the red flash is seen
      gestureRow.classList.add('sent'); // and the gesture caption fades with it
    }, 400);
    setTimeout(() => modal.classList.add('open'), PLACEHOLDER_DELAY_MS);
  }

  // ----- the CTA box never moves — it IS the track. Only the light circular
  // handle drags across it, left to right. Drag it far enough and it fires
  // the CTA, then eases back to the start; let go early and it just springs
  // back. The label fades as the handle nears it so they never collide.
  // A plain tap on the box (outside the handle) still works too. -----
  const ctaHandle = document.getElementById('ctaHandle');
  const ctaLabel = document.getElementById('ctaLabel');
  const HANDLE_MARGIN = 4; // matches the handle's inset in .cta-box
  let maxTravel = 0;

  function measureTrack(){
    maxTravel = ctaBox.getBoundingClientRect().width - ctaHandle.getBoundingClientRect().width - HANDLE_MARGIN * 2;
  }

  let dragging = false;
  let dragged = false;
  let dragStartX = 0;
  let lastProgress = 0;

  function setHandleProgress(p, animate){
    lastProgress = p;
    ctaHandle.style.transition = animate ? 'transform .4s cubic-bezier(.16,1,.3,1)' : 'none';
    ctaLabel.style.transition = animate ? 'opacity .4s ease' : 'none';
    ctaHandle.style.transform = `translateX(${maxTravel * p}px)`;
    ctaLabel.style.opacity = Math.max(0, 1 - p * 1.6); // fades before the handle reaches it
  }

  measureTrack();
  setHandleProgress(0, false);
  window.addEventListener('resize', () => { measureTrack(); if (!dragging) setHandleProgress(lastProgress, false); });

  ctaHandle.addEventListener('pointerdown', (e) => {
    measureTrack();
    dragging = true;
    dragged = false;
    dragStartX = e.clientX;
    ctaHandle.setPointerCapture(e.pointerId);
    ctaHandle.classList.add('grabbing');
    ctaBox.classList.add('dragging');
    e.stopPropagation();
  });

  ctaHandle.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    const dx = e.clientX - dragStartX;
    if (Math.abs(dx) > 3) dragged = true;
    const p = Math.min(1, Math.max(0, dx / maxTravel));
    setHandleProgress(p, false);
  });

  function endDrag(){
    if (!dragging) return;
    dragging = false;
    ctaHandle.classList.remove('grabbing');
    if (dragged && lastProgress >= 0.7) {
      setHandleProgress(1, true); // reached the end
      activateStart(); // keeps the box red — see activateStart()
      setTimeout(() => setHandleProgress(0, true), PLACEHOLDER_DELAY_MS);
    } else {
      ctaBox.classList.remove('dragging'); // didn't go far enough — back to black
      setHandleProgress(0, true); // springs back
    }
  }
  ctaHandle.addEventListener('pointerup', endDrag);
  ctaHandle.addEventListener('pointercancel', endDrag);

  ctaHandle.addEventListener('click', (e) => { e.stopPropagation(); });

  ctaBox.addEventListener('click', () => {
    if (dragged) { dragged = false; return; } // the drag already triggered it
    activateStart();
  });

  function closeModal(){
    modal.classList.remove('open');
    resetDnaEffect();
    setHandleProgress(0, true);
    if (queueAnimRafId) cancelAnimationFrame(queueAnimRafId); // stop the count-up if it's still running
    infoPanel.classList.remove('submitted'); // reset the form for next time
    waitlistEmail.value = '';
  }
  closeBtn.addEventListener('click', closeModal);
  modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });
  window.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

  // ----- translucent waitlist form inside the panel -----
  const infoPanel = document.getElementById('infoPanel');
  const waitlistForm = document.getElementById('waitlistForm');
  const waitlistEmail = document.getElementById('waitlistEmail');
  const queueNumberEl = document.getElementById('queueNumber');

  // queue position always starts counting up from 1236, so the very first
  // signup lands on 1237 — makes the list look already-inflated with demand.
  // Persisted in localStorage so it keeps climbing on every real submission.
  const QUEUE_BASE = 1236;
  function nextQueuePosition(){
    const stored = parseInt(localStorage.getItem('waitlistQueuePosition'), 10);
    const current = Number.isFinite(stored) ? stored : QUEUE_BASE;
    const next = current + 1;
    localStorage.setItem('waitlistQueuePosition', String(next));
    return next;
  }

  // counts up from 1 to the visitor's actual queue position, easing out
  // toward the end so it settles rather than snapping to a stop
  let queueAnimRafId = null;
  function animateQueueNumber(el, target, duration){
    if (queueAnimRafId) cancelAnimationFrame(queueAnimRafId);
    const startTime = performance.now();
    el.textContent = '1';
    function tick(now){
      const t = Math.min(1, (now - startTime) / duration);
      const eased = 1 - Math.pow(1 - t, 3); // ease-out cubic
      const value = Math.round(1 + (target - 1) * eased);
      el.textContent = value.toLocaleString();
      if (t < 1) {
        queueAnimRafId = requestAnimationFrame(tick);
      } else {
        el.textContent = target.toLocaleString(); // land on the exact number
        queueAnimRafId = null;
      }
    }
    queueAnimRafId = requestAnimationFrame(tick);
  }

  waitlistForm.addEventListener('submit', (e) => {
    e.preventDefault();
    if (!waitlistEmail.value) return;
    const position = nextQueuePosition();
    infoPanel.classList.add('submitted'); // swaps the input for the success view
    animateQueueNumber(queueNumberEl, position, 550);
  });

  // ----- "Share the news" — copies the page link to the clipboard and
  // gives a brief confirmation right in the button label -----
  const shareBtn = document.getElementById('shareBtn');
  const shareLabel = document.getElementById('shareLabel');
  const SHARE_DEFAULT_LABEL = shareLabel.textContent;

  async function copyPageLink(){
    const url = window.location.href;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      try {
        await navigator.clipboard.writeText(url);
        return true;
      } catch (err) { /* fall through to the manual copy below */ }
    }
    // fallback for browsers/contexts without the async Clipboard API
    const temp = document.createElement('textarea');
    temp.value = url;
    temp.style.position = 'fixed';
    temp.style.opacity = '0';
    document.body.appendChild(temp);
    temp.select();
    let copied = false;
    try { copied = document.execCommand('copy'); } catch (err) { copied = false; }
    document.body.removeChild(temp);
    return copied;
  }

  shareBtn.addEventListener('click', async () => {
    const copied = await copyPageLink();
    shareLabel.textContent = copied ? 'Link copied!' : 'Copy failed';
    setTimeout(() => { shareLabel.textContent = SHARE_DEFAULT_LABEL; }, 1800);
  });

  // ===== pinch-and-slide hand gesture — an alternate way to fire the same
  // "join the waitlist" action as dragging the handle. Pinch thumb + index
  // finger together in the air in front of the camera, then slide the pinch
  // left to right; it drives the exact same handle/progress logic as a
  // mouse or touch drag, so past 70% it triggers activateStart() the same
  // way. Uses MediaPipe's HandLandmarker, loaded on demand so nothing is
  // downloaded (and no camera permission is requested) until the visitor
  // opts in via the "Enable hand gesture" button. =====
  const gestureToggle = document.getElementById('gestureToggle');
  const gesturePreview = document.getElementById('gesturePreview');
  const gestureVideo = document.getElementById('gestureVideo');
  const gestureCanvas = document.getElementById('gestureCanvas');
  const gctx = gestureCanvas.getContext('2d');

  let handLandmarker = null;
  let gestureStream = null;
  let gestureActive = false;
  let gestureRafId = null;

  let pinching = false;
  let pinchStartRawX = 0;
  let smoothProgress = 0;

  const PINCH_ON = 0.55;   // thumb-to-index distance (relative to hand size) below this = pinched
  const PINCH_OFF = 0.85;  // above this = released — gap between the two avoids flicker at the edge
  const SWIPE_SPAN = 0.28; // normalized horizontal travel that counts as a full left-to-right slide
  const SMOOTHING = 0.4;   // 0..1, higher = snappier but jitterier

  function landmarkDist(a, b){ return Math.hypot(a.x - b.x, a.y - b.y); }

  async function loadHandLandmarker(){
    const { HandLandmarker, FilesetResolver } = await import(
      'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14'
    );
    const vision = await FilesetResolver.forVisionTasks(
      'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm'
    );
    return HandLandmarker.createFromOptions(vision, {
      baseOptions: {
        modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task',
        delegate: 'GPU'
      },
      runningMode: 'VIDEO',
      numHands: 1
    });
  }

  function endGesturePinch(){
    // mirrors endDrag() for a released-early pinch: spring back unless
    // we already crossed the trigger threshold (in which case the normal
    // "reset after the panel opens" timeout from activateStart handles it)
    if (lastProgress < 1) {
      ctaBox.classList.remove('dragging');
      setHandleProgress(0, true);
    }
    pinching = false;
    smoothProgress = 0;
  }

  function gestureLoop(){
    if (!gestureActive) return;
    const now = performance.now();
    const result = handLandmarker.detectForVideo(gestureVideo, now);

    gctx.clearRect(0, 0, gestureCanvas.width, gestureCanvas.height);

    const hand = result.landmarks && result.landmarks[0];
    if (hand) {
      const thumbTip = hand[4], indexTip = hand[8], wrist = hand[0], indexMcp = hand[9];
      const handScale = Math.max(landmarkDist(wrist, indexMcp), 0.001);
      const pinchDist = landmarkDist(thumbTip, indexTip) / handScale;
      const isPinched = pinchDist < (pinching ? PINCH_OFF : PINCH_ON);

      // draw the tracked pinch point (raw coords — the container itself is
      // mirrored in CSS, so this lines up with the mirrored video under it)
      gctx.beginPath();
      gctx.arc(indexTip.x * gestureCanvas.width, indexTip.y * gestureCanvas.height, 7, 0, Math.PI * 2);
      gctx.fillStyle = isPinched ? '#ef3e36' : 'rgba(255,255,255,.75)';
      gctx.fill();

      if (!pinching && isPinched) {
        pinching = true;
        pinchStartRawX = indexTip.x;
        smoothProgress = 0;
        measureTrack();
        ctaBox.classList.add('dragging');
      } else if (pinching && !isPinched) {
        endGesturePinch();
      } else if (pinching) {
        // video is mirrored on screen (CSS scaleX(-1)), so an onscreen
        // left→right slide corresponds to the raw x coordinate decreasing
        const onscreenDelta = pinchStartRawX - indexTip.x;
        const target = Math.min(1, Math.max(0, onscreenDelta / SWIPE_SPAN));
        smoothProgress += (target - smoothProgress) * SMOOTHING;
        setHandleProgress(smoothProgress, false);
        if (smoothProgress >= 0.7) {
          pinching = false;
          setHandleProgress(1, true);
          activateStart(); // same trigger as a completed mouse/touch drag
          setTimeout(() => setHandleProgress(0, true), PLACEHOLDER_DELAY_MS);
        }
      }
    } else if (pinching) {
      endGesturePinch(); // lost hand tracking mid-pinch — treat like a release
    }

    gestureRafId = requestAnimationFrame(gestureLoop);
  }

  const GESTURE_DEFAULT_LABEL = gestureToggle.innerHTML;

  async function startGesture(){
    gestureToggle.disabled = true;
    gestureToggle.classList.add('loading');
    gestureToggle.textContent = 'Starting camera…';
    try {
      if (!handLandmarker) handLandmarker = await loadHandLandmarker();
      gestureStream = await navigator.mediaDevices.getUserMedia({ video: { width: 320, height: 240 }, audio: false });
      gestureVideo.srcObject = gestureStream;
      await gestureVideo.play();
      gestureCanvas.width = gestureVideo.videoWidth || 320;
      gestureCanvas.height = gestureVideo.videoHeight || 240;
      gestureActive = true;
      gesturePreview.classList.add('on');
      gestureToggle.classList.add('active');
      gestureToggle.textContent = 'Gesture control on — pinch & slide right to join';
      gestureLoop();
    } catch (err) {
      console.error('Hand gesture unavailable:', err);
      gestureToggle.textContent = 'Camera unavailable';
      retrigger(gestureToggle, 'shake');
      setTimeout(() => { gestureToggle.innerHTML = GESTURE_DEFAULT_LABEL; }, 2200);
    } finally {
      gestureToggle.disabled = false;
      gestureToggle.classList.remove('loading');
    }
  }

  function stopGesture(){
    gestureActive = false;
    if (gestureRafId) cancelAnimationFrame(gestureRafId);
    if (gestureStream) gestureStream.getTracks().forEach(t => t.stop());
    gestureStream = null;
    gesturePreview.classList.remove('on');
    gestureToggle.classList.remove('active');
    gestureToggle.innerHTML = GESTURE_DEFAULT_LABEL;
    if (pinching) endGesturePinch();
  }

  gestureToggle.addEventListener('click', () => {
    if (gestureActive) stopGesture(); else startGesture();
  });
</script>

</body>
</html>
